<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo Karma Candles</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand:#7d5a44;--bg:#f4eae3;--ink:#4a372c;--muted:#8e7565;--accent:#b07563;--line:rgba(125,90,68,.18)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;color:var(--ink);background:#e9ddd4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
@page{size:A4;margin:0}
.page{width:210mm;min-height:297mm;margin:12px auto;background:var(--bg);padding:16mm 14mm;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cover img.logo{width:95mm}
.cover h1{font:500 30pt/1.05 'Cormorant Garamond',serif;margin-top:10mm}
.cover h1 em{color:var(--accent)}
.cover p{color:var(--muted);font-size:11pt;margin-top:5mm;max-width:120mm;line-height:1.5}
.cover .how{margin-top:12mm;display:flex;gap:6mm;font-size:10pt}
.cover .how span{border:1px solid var(--line);border-radius:999px;padding:3mm 5mm}
.cover .wa{margin-top:12mm;font-size:12pt;color:var(--brand);font-weight:600}
.head{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:4mm;margin-bottom:6mm}
.head img{height:14mm}
.head span{font-size:9pt;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.cat{font:600 18pt/1 'Cormorant Garamond',serif;margin:2mm 0 4mm}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.item{background:#fffbf8;border:1px solid var(--line);border-radius:4mm;overflow:hidden;break-inside:avoid}
.item img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.item .b{padding:4mm 5mm 5mm}
.item h3{font:600 15pt/1.1 'Cormorant Garamond',serif}
.item .ph{font:italic 500 11pt/1.3 'Cormorant Garamond',serif;color:var(--muted);margin-top:1mm}
.item .d{font-size:8.5pt;line-height:1.45;color:#5d4a3e;margin-top:2mm;white-space:pre-line}
.item .row{display:flex;justify-content:space-between;align-items:center;margin-top:3mm}
.item .pr{font-weight:600;font-size:12pt;color:var(--brand)}
.item .tag{font-size:7.5pt;letter-spacing:.14em;text-transform:uppercase;background:var(--bg);padding:1.5mm 3mm;border-radius:999px;color:var(--brand)}
.item .off{color:var(--accent);font-size:9pt;font-weight:500}
.foot{position:absolute;left:14mm;right:14mm;bottom:9mm;display:flex;justify-content:space-between;font-size:8.5pt;color:var(--muted);border-top:1px solid var(--line);padding-top:3mm}
.bar{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;font-size:14px;flex-wrap:wrap}
.bar button{background:#fff;color:var(--brand);border:0;border-radius:999px;padding:10px 18px;font:600 14px 'Jost';cursor:pointer}
@media print{body{background:none}.bar{display:none}.page{margin:0;box-shadow:none;page-break-after:always}}
@media screen and (max-width:820px){.page{transform-origin:top center}}
</style>
</head>
<body>
<div class="bar"><span>Así se verá tu catálogo en PDF.</span><button id="go">Guardar como PDF</button></div>
<div id="out"></div>
<script src="store.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Number(n).toLocaleString('es-MX',{maximumFractionDigits:2});
(async()=>{
  const DB=(await idb.get(KEY))||DEFAULT, s=DB.settings;
  const wa=(s.wa||'').replace(/\D/g,'');
  const waTxt=wa?`Pedidos por WhatsApp: ${wa.replace(/^52/,'').replace(/(\d{3})(\d{3})(\d{4})/,'$1 $2 $3')}`:'Pedidos por WhatsApp';
  const fecha=new Date().toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});
  const groups={};DB.products.forEach(p=>{(groups[p.cat||'Velas']=groups[p.cat||'Velas']||[]).push(p)});
  // 4 velas por hoja
  const pages=[];Object.entries(groups).forEach(([c,items])=>{for(let i=0;i<items.length;i+=4)pages.push({c,items:items.slice(i,i+4),first:i===0})});
  const foot=n=>`<div class="foot"><span>${esc(s.name)} · ${esc(waTxt)}</span><span>${fecha} · ${n}</span></div>`;
  let html=`<section class="page cover"><img class="logo" src="img/logo.png" alt=""><h1>${s.title}</h1><p>${esc(s.sub)}</p><div class="how"><span>1 · Elige tus velas</span><span>2 · Mándanos tu pedido</span><span>3 · Te confirmamos</span></div><div class="wa">${esc(waTxt)}</div>${foot(1)}</section>`;
  pages.forEach((pg,i)=>{html+=`<section class="page"><div class="head"><img src="img/logo.png" alt=""><span>Catálogo</span></div>${pg.first?`<div class="cat">${esc(pg.c)}</div>`:''}<div class="grid">${pg.items.map(p=>`<div class="item">${p.photos[0]?`<img src="${esc(p.photos[0])}" alt="">`:''}<div class="b"><h3>${esc(p.name)}</h3>${p.phrase?`<div class="ph">${esc(p.phrase)}</div>`:''}${p.desc?`<div class="d">${esc(p.desc)}</div>`:''}<div class="row"><span class="pr">${p.price==null?'Precio a consultar':money(p.price)}</span>${!p.avail?'<span class="off">Agotada</span>':p.tag?`<span class="tag">${esc(p.tag)}</span>`:''}</div></div></div>`).join('')}</div>${foot(i+2)}</section>`});
  document.getElementById('out').innerHTML=html;
  const fit=()=>{const w=document.documentElement.clientWidth;document.querySelectorAll('.page').forEach(p=>{const s=Math.min(1,(w-16)/p.offsetWidth);p.style.transform=s<1?`scale(${s})`:'';p.style.marginBottom=s<1?`${-(1-s)*p.offsetHeight+12}px`:''})};
  fit();addEventListener('resize',fit);
  document.getElementById('go').onclick=()=>{document.querySelectorAll('.page').forEach(p=>{p.style.transform='';p.style.marginBottom=''});window.print();setTimeout(fit,500)};
})();
</script>
</body>
</html>
